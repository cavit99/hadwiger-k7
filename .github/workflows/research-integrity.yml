name: Research integrity

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Classify CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run_tool_tests: ${{ steps.scope.outputs.run_tool_tests }}
      verifier_mode: ${{ steps.scope.outputs.verifier_mode }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Classify changes
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: >-
          python tools/ci_scope.py
          --event "$GITHUB_EVENT_NAME"
          --base "$CI_BASE_SHA"
          --selection-file .cache/ci-verifier-ids.txt
          >> "$GITHUB_OUTPUT"

  integrity:
    name: Research integrity and infrastructure
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run infrastructure tests
        if: needs.scope.outputs.run_tool_tests == 'true'
        run: uv run --locked python -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Validate the current spine and build the tracked-document index
        run: uv run --locked python tools/research_index.py ci --skip-verifiers

  selected-verifiers:
    name: Changed deterministic verifiers
    needs: scope
    if: needs.scope.outputs.verifier_mode == 'selected'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Classify changes
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: >-
          uv run --locked python tools/ci_scope.py
          --event "$GITHUB_EVENT_NAME"
          --base "$CI_BASE_SHA"
          --selection-file .cache/ci-verifier-ids.txt
          >> "$GITHUB_OUTPUT"
      - name: Install nauty for the degree-nine finite verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y nauty
          if ! command -v geng >/dev/null && command -v nauty-geng >/dev/null; then
            sudo ln -s "$(command -v nauty-geng)" /usr/local/bin/geng
          fi
      - name: Run changed deterministic verifiers
        run: uv run --locked python tools/research_index.py verify --ids-file .cache/ci-verifier-ids.txt

  full-verifiers:
    name: Deterministic verifier shard ${{ matrix.shard }} of 0-4
    needs: scope
    if: needs.scope.outputs.verifier_mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Install nauty for the degree-nine finite verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y nauty
          if ! command -v geng >/dev/null && command -v nauty-geng >/dev/null; then
            sudo ln -s "$(command -v nauty-geng)" /usr/local/bin/geng
          fi
      - name: Run deterministic verifier shard
        run: >-
          uv run --locked python tools/research_index.py verify
          --shard-index "${{ matrix.shard }}"
          --shard-count 5
